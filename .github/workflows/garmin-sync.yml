name: Synchronisation Garmin

on:
  schedule:
    # 11h00 UTC = 7h00 heure de l'Est (EDT) / 6h00 (EST hiver)
    - cron: "37 11 * * *"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install --upgrade garminconnect curl_cffi

      - name: Synchroniser les données Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python3 scripts/sync_garmin.py

      - name: Régénérer data.js
        run: python3 scripts/build_data_js.py

      - name: Commit et push si des changements existent
        run: |
          git config user.name "garmin-sync-bot"
          git config user.email "actions@github.com"
          git add data_store.json data.js
          git diff --quiet --cached || git commit -m "Sync auto Garmin ($(date -u +%Y-%m-%d))"
          git push
